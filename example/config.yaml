# Example config. The `workers` list is generated, not written by hand:
#   optimus discover --config example/config.yaml
cluster:
  name: optimus-example
  protocol_version: 1
  secret: "optimus-cluster-secret"

controller:
  hostname: controller
  tcp_port: 45870
  dashboard_port: 8080

discovery:
  method: mdns_nmap
  scan_interval: 30
  subnet: ""   # empty = auto-detect from the local interface
  use_configured_hosts: true

workers: []   # generated: run `optimus discover --config example/config.yaml`

communication:
  request_timeout: 3.0
  probe_interval: 5.0
  failure_threshold: 3
  max_message_size: 4194304

dataset:
  controller_storage: /srv/datasets
  nfs_server: ""   # set by `optimus discover`
  nfs_export: /srv/datasets
  worker_nfs_mount: /mnt/nfs-origin
  fuse_mount: /mnt/dataset

cache:
  directory: /var/cache/optimus
  database: /var/cache/optimus/cache.db
  max_capacity_gb: 50

training:
  backend: gloo
  checkpoint_directory: /srv/checkpoints
  max_restarts: 3

scheduler:
  output_directory: ./runs
  default_workers: 1

logging:
  level: INFO
  directory: ./logs
