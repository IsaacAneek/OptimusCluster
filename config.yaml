# Generated by `optimus discover` - do not hand-maintain the worker list.
# Re-run `optimus discover` (or use Scan in the dashboard) after the cluster changes.
cluster:
  name: optimus
  protocol_version: 1
  secret: optimus-cluster-secret
controller:
  hostname: isaac.local
  tcp_port: 45870
  dashboard_port: 8080
discovery:
  method: mdns_nmap
  scan_interval: 30
  subnet: 192.168.10.0/24
  use_configured_hosts: true
workers:
- hostname: pi03.local
  enabled: true
- hostname: pi02.local
  enabled: true
communication:
  request_timeout: 3.0
  probe_interval: 5.0
  failure_threshold: 3
  max_message_size: 4194304
dataset:
  controller_storage: /srv/datasets
  nfs_export: /srv/datasets
  worker_nfs_mount: /mnt/nfs-origin
  fuse_mount: /mnt/dataset
  nfs_server: 192.168.10.127
cache:
  directory: /var/cache/optimus
  database: /var/cache/optimus/cache.db
  max_capacity_gb: 50
training:
  backend: gloo
  checkpoint_directory: /srv/checkpoints
  max_restarts: 3
scheduler:
  output_directory: ./runs
  default_workers: 2
logging:
  level: INFO
  directory: ./logs
hosts:
- ip: 192.168.10.1
  hostname: _gateway
  optimusd: false
  local: false
- ip: 192.168.10.101
  hostname: pi03.local
  optimusd: true
  local: false
- ip: 192.168.10.127
  hostname: isaac.local
  optimusd: false
  local: true
- ip: 192.168.10.150
  hostname: pi02.local
  optimusd: true
  local: false
